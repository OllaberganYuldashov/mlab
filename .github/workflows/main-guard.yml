# main-guard: main'ga PR'siz tushgan commit, force push yoki tunda (23:00–07:00 Toshkent) merge qilingan PR'ni
# aniqlaydi va darhol issue ochadi.
# Oldini olmaydi (bepul private repoda himoya yo'q), lekin buzilish bo'lsa bir necha daqiqada bilasiz.
# GitHub veb-sahifasida qilingan commit'lar (siz qo'lda yuklagan fayllar, PR merge) ruxsat etilgan.
# Tungi (23:00–07:00) merge faqat egasi qilmagan va merge-gate'dan o'tmagan bo'lsa ogohlantiradi:
# egasining merge'lari va Claude'ning merge-gate'dan o'tgan avtomatik merge'lari istalgan vaqtda ruxsat etilgan.
name: main-guard

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  guard:
    name: main-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ev = context.payload;
            const problems = [];

            if (ev.forced) {
              problems.push(`**Force push**: main \`${ev.before.slice(0, 7)}\` → \`${ev.after.slice(0, 7)}\` ga qayta yozildi. Taqqoslash: ${ev.compare}`);
            }

            // Tungi vaqt (Toshkent, UTC+5): 23:00–07:00 — egasi uxlayotgan payt
            const nightPR = (iso) => {
              const h = (new Date(iso).getUTCHours() + 5) % 24;
              return h >= 23 || h < 7;
            };
            const seenPR = new Set();

            // Commit -> PR bog'lanishi merge'dan keyin bir necha soniya kechikib indekslanishi mumkin
            // (#34). Shuning uchun: 1) bo'sh javobda 20 s kutib qayta so'raladi; 2) shu push'dagi
            // merge qilingan PR'larning commit ro'yxati olinadi — ro'yxatdagi commit PR orqali kelgan.
            // Hech bir merge qilingan PR'da yo'q commit (to'g'ridan-to'g'ri push) avvalgidek ushlanadi.
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const prsOf = async (sha) => {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: sha,
              });
              return data;
            };
            const commits = ev.commits || [];
            const prsByCommit = new Map();
            for (const c of commits) {
              let prs = await prsOf(c.id);
              if (prs.length === 0 && !viaPR.has(c.id)) {
                await sleep(20000);
                prs = await prsOf(c.id);
              }
              prsByCommit.set(c.id, prs);
            }
            const mergedPRs = new Set();
            for (const prs of prsByCommit.values()) {
              for (const pr of prs) if (pr.merged_at) mergedPRs.add(pr.number);
            }
            const viaPR = new Set();
            for (const number of mergedPRs) {
              const prCommits = await github.paginate(github.rest.pulls.listCommits, {
                owner, repo, pull_number: number, per_page: 100,
              });
              for (const pc of prCommits) viaPR.add(pc.sha);
            }

            for (const c of commits) {
              const prs = prsByCommit.get(c.id) || [];
              // Tunda merge qilingan PR — egasi uxlayotganda kim merge qildi?
              for (const pr of prs) {
                if (pr.merged_at && !seenPR.has(pr.number) && nightPR(pr.merged_at)) {
                  seenPR.add(pr.number);
                  // Repo egasining o'zi merge qilgan PR — istalgan vaqtda ruxsat
                  const { data: full } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
                  if (full.merged_by && full.merged_by.login.toLowerCase() === owner.toLowerCase()) {
                    core.info(`PR #${pr.number}: egasi merge qilgan — ruxsat etilgan.`);
                    continue;
                  }
                  // merge-gate'dan o'tgan claude/ PR — ruxsat etilgan avtomatik merge
                  if (pr.head.ref.startsWith('claude/')) {
                    const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                      owner, repo, head_sha: pr.head.sha, per_page: 100,
                    });
                    const gate = runs.workflow_runs
                      .filter((r) => r.name === 'merge-gate')
                      .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
                      .pop();
                    if (gate && gate.conclusion === 'success') {
                      core.info(`PR #${pr.number}: merge-gate yashil — ruxsat etilgan avtomatik merge.`);
                      continue;
                    }
                  }
                  const t = new Date(new Date(pr.merged_at).getTime() + 5 * 3600 * 1000).toISOString().slice(11, 16);
                  problems.push(`PR #${pr.number} tungi vaqtda (${t} Toshkent) merge qilingan. Buni siz qildingizmi?`);
                }
              }
              // Veb-sahifadagi commit'lar (qo'lda yuklash, PR merge tugmasi) — ruxsat etilgan
              if (c.committer && c.committer.username === 'web-flow') continue;
              if (prs.length === 0 && !viaPR.has(c.id)) {
                const title = c.message.split('\n')[0];
                problems.push(`PR'siz commit [\`${c.id.slice(0, 7)}\`](${c.url}): ${title} (muallif: ${c.author.name})`);
              }
            }

            if (problems.length === 0) {
              core.info("main toza: hamma o'zgarish PR orqali yoki veb-sahifadan.");
              return;
            }

            const body = [
              "main branch'da shubhali o'zgarish aniqlandi. Bu loyiha qoidasiga zid bo'lishi mumkin.",
              '',
              ...problems.map((p) => '- ' + p),
              '',
              '**Nima qilish kerak:**',
              "1. O'zgarish sizniki bo'lsa, bu issue'ni yoping.",
              "2. Claude'niki bo'lsa, keyingi run uni avval tekshiradi va kerak bo'lsa revert PR ochadi.",
              "3. Force push bo'lsa, eski holat haftalik zaxirada saqlangan (Actions → weekly-backup).",
            ].join('\n');

            const issue = {
              owner, repo,
              title: `main-guard: shubhali o'zgarish (${ev.after.slice(0, 7)})`,
              body,
            };
            try {
              await github.rest.issues.create({ ...issue, labels: ['alert:main-guard'] });
            } catch (e) {
              await github.rest.issues.create(issue);
            }
            core.setFailed("main'da shubhali o'zgarish — issue ochildi.");
