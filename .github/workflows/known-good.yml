# known-good: main'dagi commit uchun barcha tekshiruvlar (secret-scan, main-guard, ci) yashil bo'lsa,
# unga "yashil nuqta" tegini qo'yadi: good-YYYY-MM-DD-HHMM-<sha7> (vaqt Toshkent bo'yicha).
# Qizil chiroq yonganda Claude shu teglardan eng yaqin ishlaydigan versiyani topadi.
# Teg'larni Claude'ning o'zi bulutdan qo'ya olmaydi (proxy teg push'ini rad etadi), shuning uchun bu ishni Actions bajaradi.
name: known-good

on:
  workflow_run:
    workflows: ["secret-scan", "main-guard", "ci"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: known-good-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  tag:
    name: known-good
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.workflow_run.head_sha;
            // CI workflow skelet sessiyasida "ci" nomi bilan yaratiladi. Mavjud bo'lmagan nom e'tiborga olinmaydi.
            const REQUIRED = ['secret-scan', 'main-guard', 'ci'];

            const { data: wf } = await github.rest.actions.listRepoWorkflows({ owner, repo, per_page: 100 });
            const existing = wf.workflows.filter((w) => REQUIRED.includes(w.name) && w.state === 'active');

            for (const w of existing) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: w.id, head_sha: sha, per_page: 5,
              });
              const run = data.workflow_runs[0];
              if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
                const st = run ? `${run.status}/${run.conclusion}` : "run yo'q";
                core.info(`${w.name}: hali yashil emas (${st}) — teg qo'yilmaydi.`);
                return;
              }
            }

            const { data: tags } = await github.rest.repos.listTags({ owner, repo, per_page: 100 });
            if (tags.some((t) => t.name.startsWith('good-') && t.commit.sha === sha)) {
              core.info('Bu commit allaqachon yashil nuqta sifatida belgilangan.');
              return;
            }

            const d = new Date(Date.now() + 5 * 3600 * 1000).toISOString();
            const tag = `good-${d.slice(0, 10)}-${d.slice(11, 13)}${d.slice(14, 16)}-${sha.slice(0, 7)}`;
            try {
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
              core.info(`Yashil nuqta qo'yildi: ${tag}`);
            } catch (e) {
              core.info(`Teg qo'yilmadi (ehtimol parallel run qo'ygan): ${e.message}`);
            }
