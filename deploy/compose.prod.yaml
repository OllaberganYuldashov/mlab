# compose.prod.yaml (R0-15; ADR-0004) — prod servisi (4 GB RAM, bitta server).
# Ishga tushirish (serverda, repo ildizidan):
#   docker compose -f deploy/compose.prod.yaml --env-file /opt/mlab/.env up -d --build
# Secret'lar faqat serverdagi .env da (chmod 600); repoda yo'q. Majburiy qiymat yo'q bo'lsa compose to'xtaydi.
# DIQQAT: `docker compose down` ga volume bayrog'ini QO'SHMANG — baza ma'lumoti yo'qoladi (docs/learn/server.md).
#
# RAM taqsimoti (4 GB): db 1 GB · web 1 GB · redis 256 MB · caddy 128 MB · migrate (vaqtincha) 512 MB;
# qolgani OS va keyingi servislarga (Celery worker va sandbox — I3 da, ular uchun ~1.5 GB zaxira).

name: mlab-prod

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  APP_ENV: production
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY kerak}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS kerak}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS kerak}
  DATABASE_URL: postgres://${POSTGRES_USER:-mlab}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}@db:5432/${POSTGRES_DB:-mlab}
  REDIS_URL: redis://redis:6379/0
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
  TIME_ZONE: Asia/Tashkent
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}

services:
  db:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlab}
      POSTGRES_USER: ${POSTGRES_USER:-mlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
      TZ: Asia/Tashkent
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks: [internal]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Bir martalik: migratsiya va statik fayllar. Muvaffaqiyatli tugamasa web ishga tushmaydi.
  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: mlab-backend:${MLAB_VERSION:-local}
    restart: "no"
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    environment: *backend-env
    volumes:
      - static:/app/staticfiles
    networks: [internal]
    mem_limit: 512m
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    image: mlab-backend:${MLAB_VERSION:-local}
    restart: unless-stopped
    environment: *backend-env
    networks: [internal]
    mem_limit: 1g
    depends_on:
      migrate: {condition: service_completed_successfully}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # Prod'da HTTPS yo'naltirish va ALLOWED_HOSTS tekshiruvi bor: birinchi ruxsat etilgan host va https sarlavhasi bilan.
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request
          host = os.environ["ALLOWED_HOSTS"].split(",")[0].strip()
          req = urllib.request.Request("http://127.0.0.1:8000/readyz", headers={"Host": host, "X-Forwarded-Proto": "https"})
          urllib.request.urlopen(req, timeout=4)
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s

  caddy:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: mlab-caddy:${MLAB_VERSION:-local}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS kerak (domen yoki :80)}
    # Tashqariga faqat Caddy ochiq; db, redis va web ichki tarmoqda.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static:/srv/static:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    mem_limit: 128m
    depends_on:
      web: {condition: service_healthy}
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/ping"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 10s

networks:
  internal: {}

volumes:
  db-data:
  redis-data:
  static:
  caddy-data:
  caddy-config:
