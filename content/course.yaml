# Kurs meta ma'lumotlari (ADR-0002). Import: cd backend && uv run python manage.py import_content ../content
slug: machine-learning
title: Machine Learning
version: "2026.1"
# Kurs default sozlamalari (SET, I1-07). Guruhda o'qituvchi override qiladi; kalit yo'q bo'lsa — model default'i.
defaults:
  ai_enabled: true
  ai_max_mode: explain        # off | guide | explain | full (AI-01)
  practice_after_close: false # ACC-08
  late_hours: 0               # ACC-07: yopilgandan keyin necha soat topshirish mumkin (0..168)
  late_penalty_percent: 0     # ACC-07: faqat kurs darajasida (0..100)
  chat_enabled: true          # SET-05
  quiz_questions: 10          # CNT-06: mavzu testidagi savollar soni (1..50; bank kichik bo'lsa — hammasi)
  quiz_minutes: 15            # CNT-06: test vaqti, daqiqa (1..180)
  quiz_attempts: 3            # CNT-06: urinishlar soni (1..10)
  paste_limit: 200            # INT-01: laboratoriyada bir martada joylashtirish chegarasi, belgi (0..10000)
