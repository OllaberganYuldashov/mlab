challenge: |
  Chegara (threshold) 0.1 dan 0.9 gacha (0.1 qadam) o'zgarganda precision va recall qiymatlarini `pr_by_threshold` lug'atiga yozing.
independent: |
  Nobalans datasetda ROC-AUC: musbat sinfni 10% gacha kamaytirib (undersample), accuracy va ROC-AUC qanday o'zgarishini solishtiring; nega accuracy aldaydi?
