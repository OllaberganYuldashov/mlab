code: A10
title: "k-fold va GridSearch"
topic: M06
statement: |
  **Dataset:** `{dataset}`, **fold'lar:** `{folds}`.

  Tayyorlash: `df = mlab.load("{dataset}")`, `X = df.drop(columns=["{target}"])`, `y = df["{target}"]`;
  `cv = KFold(n_splits={folds}, shuffle=True, random_state={seed})`.
  Masshtablash har doim pipeline ichida: `make_pipeline(StandardScaler(), <model>)`.

  1. **Cross-validation.** `scores = cross_val_score(make_pipeline(StandardScaler(), LogisticRegression(max_iter=1000)), X, y, cv=cv)`;
     o'rtacha natija — `cv_mean` (`float(scores.mean())`).
  2. **GridSearch.** `grid = GridSearchCV(make_pipeline(StandardScaler(), KNeighborsClassifier()),
     param_grid=dict(kneighborsclassifier__n_neighbors=[1, 3, 5, 7, 9, 11]), cv=cv).fit(X, y)`;
     eng yaxshi `k` — `best_k` (`grid.best_params_["kneighborsclassifier__n_neighbors"]`),
     uning natijasi — `best_score` (`float(grid.best_score_)`).
  3. **Taqqoslash.** `winner = "logreg"` yoki `"knn"` — `cv_mean` va `best_score` kattasi (teng bo'lsa `"logreg"`).
steps:
  - key: cv
    title: "Cross-validation"
    points: 35
  - key: grid
    title: "GridSearch"
    points: 40
  - key: compare
    title: "Taqqoslash"
    points: 25
challenge: |
  Xuddi shu `cv` bilan `DecisionTreeClassifier` uchun `max_depth` (1..10) va `min_samples_leaf` (1, 5, 10) bo'yicha GridSearch qiling; eng yaxshi juftlik — `best_tree`.
independent: |
  RandomizedSearch bilan taqqoslash: `RandomizedSearchCV` (n_iter=10) va `GridSearchCV` ni bir xil qidiruv maydonida natija va vaqt bo'yicha solishtiring.
