openapi: 3.0.3
info:
  title: MLab API
  version: 0.1.0
paths:
  /api/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      description: 'SPA birinchi chaqiradi: `csrftoken` cookie, keyin u `X-CSRFToken`
        sarlavhasida.'
      summary: CSRF cookie o'rnatish
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/login:
    post:
      operationId: auth_login_create
      summary: Hemis ID va parol bilan kirish (AUTH-02)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginFailed'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginLocked'
          description: ''
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      summary: Chiqish
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me:
    get:
      operationId: auth_me_retrieve
      summary: Joriy foydalanuvchi
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/register:
    post:
      operationId: auth_register_create
      summary: Talaba ro'yxatdan o'tadi (AUTH-01)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
        '400':
          description: No response body
  /api/directions:
    get:
      operationId: directions_list
      description: Ro'yxatdan o'tish formasidagi yo'nalishlar (kichik ro'yxat — sahifalashsiz).
      tags:
      - directions
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Direction'
          description: ''
components:
  schemas:
    Direction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nomi
      required:
      - id
      - name
    LoginFailed:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    LoginLocked:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    LoginRequest:
      type: object
      properties:
        hemis_id:
          type: string
          minLength: 1
          maxLength: 32
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - hemis_id
      - password
    Me:
      type: object
      properties:
        hemis_id:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
          title: FIO
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          title: Rol
        direction:
          type: integer
          readOnly: true
          nullable: true
          title: Yo'nalish
      required:
      - direction
      - full_name
      - hemis_id
      - role
    Register:
      type: object
      properties:
        hemis_id:
          type: string
          maxLength: 32
        full_name:
          type: string
          maxLength: 150
        direction:
          type: integer
      required:
      - direction
      - full_name
      - hemis_id
    RegisterRequest:
      type: object
      properties:
        hemis_id:
          type: string
          minLength: 1
          maxLength: 32
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        direction:
          type: integer
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        consent:
          type: boolean
          writeOnly: true
        policy_version:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 32
      required:
      - consent
      - direction
      - full_name
      - hemis_id
      - password
      - policy_version
    RoleEnum:
      enum:
      - super_admin
      - admin
      - instructor
      - student
      type: string
      description: |-
        * `super_admin` - Super admin
        * `admin` - Admin
        * `instructor` - O'qituvchi
        * `student` - Talaba
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
