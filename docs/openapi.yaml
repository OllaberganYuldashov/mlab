openapi: 3.0.3
info:
  title: MLab API
  version: 0.1.0
paths:
  /api/auth/change-password:
    post:
      operationId: auth_change_password_create
      summary: Parolni almashtirish
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      description: 'SPA birinchi chaqiradi: `csrftoken` cookie, keyin u `X-CSRFToken`
        sarlavhasida.'
      summary: CSRF cookie o'rnatish
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/login:
    post:
      operationId: auth_login_create
      summary: Hemis ID va parol bilan kirish (AUTH-02)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginFailed'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginLocked'
          description: ''
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      summary: Chiqish
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me:
    get:
      operationId: auth_me_retrieve
      summary: Joriy foydalanuvchi
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/register:
    post:
      operationId: auth_register_create
      summary: Talaba ro'yxatdan o'tadi (AUTH-01)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
        '400':
          description: No response body
  /api/directions:
    get:
      operationId: directions_list
      description: Ro'yxatdan o'tish formasidagi yo'nalishlar (kichik ro'yxat — sahifalashsiz).
      tags:
      - directions
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Direction'
          description: ''
  /api/instructors:
    post:
      operationId: instructors_create
      description: Admin yoki super admin o'qituvchi yaratadi; vaqtinchalik parol
        javobda bir marta.
      summary: O'qituvchi akkauntini yaratish
      tags:
      - instructors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstructorCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructorCreated'
          description: ''
  /api/instructors/{user_id}:
    patch:
      operationId: instructors_partial_update
      summary: O'qituvchining talaba limitini o'zgartirish
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - instructors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInstructorRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructor'
          description: ''
  /api/join/{token}:
    get:
      operationId: join_retrieve
      summary: Havola bo'yicha guruhni ko'rish
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - join
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinPreview'
          description: ''
    post:
      operationId: join_create
      summary: A'zolik so'rovini yuborish
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - join
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyMembership'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyMembership'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRefused'
          description: ''
  /api/me/deadlines:
    get:
      operationId: me_deadlines_retrieve
      description: 'Talaba: faqat tasdiqlangan guruhining muddatlari.'
      summary: Mening mustaqil topshiriq muddatlarim
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyDeadlines'
          description: ''
  /api/me/membership:
    get:
      operationId: me_membership_retrieve
      summary: Talabaning oxirgi a'zoligi va holati
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyMembershipEnvelope'
          description: ''
  /api/policy:
    get:
      operationId: policy_retrieve
      description: Ro'yxatdan o'tish formasi yuboradigan siyosat versiyasi — `Consent`
        bilan bir manba.
      summary: Joriy siyosat versiyasi
      tags:
      - policy
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyVersion'
          description: ''
  /api/sections:
    get:
      operationId: sections_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSectionList'
          description: ''
    post:
      operationId: sections_create
      tags:
      - sections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Section'
          description: ''
  /api/sections/{section_id}:
    get:
      operationId: sections_retrieve
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionUpdate'
          description: ''
    patch:
      operationId: sections_partial_update
      summary: Guruhni o'zgartirish (nomi, sig'im, qo'shilish)
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSectionUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionUpdate'
          description: ''
  /api/sections/{section_id}/ai/disable:
    post:
      operationId: sections_ai_disable_create
      description: 'SET-02: AI tutorni bir tugma bilan darhol o''chirish yoki yoqish
        (tasdiq so''ralmaydi).'
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionSettings'
          description: ''
  /api/sections/{section_id}/ai/enable:
    post:
      operationId: sections_ai_enable_create
      description: 'SET-02: AI tutorni bir tugma bilan darhol o''chirish yoki yoqish
        (tasdiq so''ralmaydi).'
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionSettings'
          description: ''
  /api/sections/{section_id}/deadlines:
    get:
      operationId: sections_deadlines_retrieve
      summary: Guruhning mustaqil topshiriq muddatlari
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadlineList'
          description: ''
  /api/sections/{section_id}/deadlines/{code}:
    put:
      operationId: sections_deadlines_update
      summary: Muddat
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeadlinePutRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndependentDeadline'
          description: ''
    delete:
      operationId: sections_deadlines_destroy
      summary: Muddatni olib tashlash
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/sections/{section_id}/join-token:
    post:
      operationId: sections_join_token_create
      description: 'SEC-02: havolani yangilash (eskisi darhol bekor) yoki o''chirish.'
      summary: Havolani yangilash
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinToken'
          description: ''
    delete:
      operationId: sections_join_token_destroy
      description: 'SEC-02: havolani yangilash (eskisi darhol bekor) yoki o''chirish.'
      summary: Havolani o'chirib qo'yish
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/sections/{section_id}/members:
    get:
      operationId: sections_members_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - pending
          default: pending
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMemberList'
          description: ''
  /api/sections/{section_id}/members/{membership_id}/move:
    post:
      operationId: sections_members_move_create
      description: 'SEC-07: faqat shu guruh o''qituvchisining boshqa guruhiga (begona
        guruh — 404).'
      summary: Talabani boshqa guruhga o'tkazish
      parameters:
      - in: path
        name: membership_id
        schema:
          type: integer
        required: true
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
  /api/sections/{section_id}/members/{membership_id}/remove:
    post:
      operationId: sections_members_remove_create
      summary: Talabani guruhdan chiqarish
      parameters:
      - in: path
        name: membership_id
        schema:
          type: integer
        required: true
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/sections/{section_id}/members/decide:
    post:
      operationId: sections_members_decide_create
      summary: So'rovlarni tasdiqlash yoki rad etish (bittalab yoki ommaviy)
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideResult'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideRefused'
          description: ''
  /api/sections/{section_id}/settings:
    get:
      operationId: sections_settings_retrieve
      summary: Guruh sozlamalari
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionSettings'
          description: ''
    patch:
      operationId: sections_settings_partial_update
      summary: Guruh override'larini o'zgartirish (null — kurs qiymati)
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOverridesRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionSettings'
          description: ''
  /api/sections/{section_id}/windows:
    get:
      operationId: sections_windows_retrieve
      summary: Guruh mavzulari bo'yicha kirish oynalari
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessWindowList'
          description: ''
  /api/sections/{section_id}/windows/{code}:
    put:
      operationId: sections_windows_update
      summary: Oynani belgilash
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowPutRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessWindowRow'
          description: ''
  /api/sections/{section_id}/windows/{code}/close:
    post:
      operationId: sections_windows_close_create
      description: |-
        Ochiq oyna yopilsa yopilish lahzasi saqlanadi (`closes_at=now`): kechikish va mashq shundan
        hisoblanadi (ACC-07/08). Hali ochilmagan oyna — `closed`; allaqachon yopilgani o'zgarmaydi.
      summary: Oynani yopish
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessWindowRow'
          description: ''
  /api/sections/{section_id}/windows/{code}/open-now:
    post:
      operationId: sections_windows_open_now_create
      summary: Hozir ochish
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenNowRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessWindowRow'
          description: ''
  /api/sections/{section_id}/windows/plan:
    post:
      operationId: sections_windows_plan_create
      description: 'ACC-04: `preview: true` faqat ko''rsatadi; `false` bitta tranzaksiyada
        saqlaydi.'
      summary: Haftalik slot bo'yicha oynalarni rejalashtirish
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindowPlan'
          description: ''
  /api/users/{user_id}/reset-password:
    post:
      operationId: users_reset_password_create
      description: Vaqtinchalik parol faqat shu javobda bir marta qaytadi; saqlanmaydi
        va loglanmaydi.
      summary: Parolni tiklash
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryPassword'
          description: ''
components:
  schemas:
    AccessWindowList:
      type: object
      properties:
        windows:
          $ref: '#/components/schemas/AccessWindowRow'
        server_time:
          type: string
          format: date-time
      required:
      - server_time
      - windows
    AccessWindowRow:
      type: object
      properties:
        topic:
          type: object
          additionalProperties: {}
        mode:
          type: string
        proctored:
          type: boolean
        state:
          type: object
          additionalProperties: {}
      required:
      - mode
      - proctored
      - state
      - topic
    AiMaxModeEnum:
      enum:
      - 'off'
      - guide
      - explain
      - full
      type: string
      description: |-
        * `off` - O'chiq
        * `guide` - Yo'naltiruvchi
        * `explain` - Tushuntirish
        * `full` - To'liq yordam
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - new_password
      - old_password
    DeadlineList:
      type: object
      properties:
        deadlines:
          $ref: '#/components/schemas/IndependentDeadline'
      required:
      - deadlines
    DeadlinePutRequest:
      type: object
      properties:
        due_at:
          type: string
          format: date-time
      required:
      - due_at
    DecideRefused:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
      required:
      - code
      - detail
    DecideRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 500
          minItems: 1
        decision:
          $ref: '#/components/schemas/DecisionEnum'
      required:
      - decision
      - ids
    DecideResult:
      type: object
      properties:
        approved:
          type: array
          items:
            type: integer
        rejected:
          type: array
          items:
            type: integer
        skipped:
          type: array
          items:
            type: integer
      required:
      - approved
      - rejected
      - skipped
    DecisionEnum:
      enum:
      - approve
      - reject
      type: string
      description: |-
        * `approve` - approve
        * `reject` - reject
    Direction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nomi
      required:
      - id
      - name
    IndependentDeadline:
      type: object
      properties:
        assignment:
          type: string
        due_at:
          type: string
          format: date-time
      required:
      - assignment
      - due_at
    Instructor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        hemis_id:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
          title: FIO
        student_limit:
          type: integer
          maximum: 10000
          minimum: 1
          title: Talaba limiti
      required:
      - full_name
      - hemis_id
      - id
      - student_limit
    InstructorBrief:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
      required:
      - full_name
      - id
    InstructorBriefRequest:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
          minLength: 1
      required:
      - full_name
      - id
    InstructorCreateRequest:
      type: object
      description: 'AUTH-05: rol serializer''da yo''q — har doim `instructor` (mass
        assignment imkonsiz).'
      properties:
        hemis_id:
          type: string
          minLength: 1
          maxLength: 32
        full_name:
          type: string
