        hemis_id:
          type: string
          minLength: 1
          maxLength: 32
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        student_limit:
          type: integer
          maximum: 10000
          minimum: 1
      required:
      - full_name
      - hemis_id
      - student_limit
    InstructorCreated:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        hemis_id:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
          title: FIO
        student_limit:
          type: integer
          maximum: 10000
          minimum: 1
          title: Talaba limiti
        temporary_password:
          type: string
          readOnly: true
      required:
      - full_name
      - hemis_id
      - id
      - student_limit
      - temporary_password
    JoinPreview:
      type: object
      properties:
        section:
          type: string
        instructor:
          type: string
        join_enabled:
          type: boolean
        is_full:
          type: boolean
      required:
      - instructor
      - is_full
      - join_enabled
      - section
    JoinRefused:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
      required:
      - code
      - detail
    JoinToken:
      type: object
      properties:
        token:
          type: string
        join_path:
          type: string
      required:
      - join_path
      - token
    KindEnum:
      enum:
      - paste
      type: string
      description: '* `paste` - paste'
    LabEventOut:
      type: object
      properties:
        blocked:
          type: boolean
      required:
      - blocked
    LabSaveInRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 0
        notebook: {}
      required:
      - notebook
      - version
    LabSaveOut:
      type: object
      properties:
        version:
          type: integer
        saved_at:
          type: string
          format: date-time
        policy:
          $ref: '#/components/schemas/PolicyEnum'
      required:
      - policy
      - saved_at
      - version
    LabState:
      type: object
      properties:
        status:
          type: string
        opens_at:
          type: string
          format: date-time
          nullable: true
        closes_at:
          type: string
          format: date-time
          nullable: true
      required:
      - closes_at
      - opens_at
      - status
    LabWorkOut:
      type: object
      properties:
        version:
          type: integer
        notebook:
          nullable: true
        saved_at:
          type: string
          format: date-time
          nullable: true
        policy:
          $ref: '#/components/schemas/PolicyEnum'
        paste_limit:
          type: integer
        proctored:
          type: boolean
      required:
      - notebook
      - paste_limit
      - policy
      - proctored
      - saved_at
      - version
    LectureOut:
      type: object
      properties:
        topic:
          $ref: '#/components/schemas/TopicRef'
        title:
          type: string
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/LectureStepOut'
      required:
      - next
      - prev
      - steps
      - title
      - topic
    LectureStepOut:
      type: object
      properties:
        order:
          type: integer
        title:
          type: string
        body:
          type: string
        question:
          nullable: true
      required:
      - body
      - order
      - question
      - title
    LevelEnum:
      enum:
      - basic
      - medium
      - advanced
      type: string
      description: |-
        * `basic` - basic
        * `medium` - medium
        * `advanced` - advanced
    LevelSourceEnum:
      enum:
      - rule
      - instructor
      type: string
      description: |-
        * `rule` - rule
        * `instructor` - instructor
    LoginFailed:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    LoginLocked:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    LoginRequest:
      type: object
      properties:
        hemis_id:
          type: string
          minLength: 1
          maxLength: 32
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - hemis_id
      - password
    Me:
      type: object
      properties:
        hemis_id:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
          title: FIO
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          title: Rol
        direction:
          type: integer
          readOnly: true
          nullable: true
          title: Yo'nalish
        must_change_password:
          type: boolean
          readOnly: true
          title: Parolni almashtirishi shart
      required:
      - direction
      - full_name
      - hemis_id
      - must_change_password
      - role
    Member:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/StudentBrief'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
          default: pending
          title: Holat
        requested_at:
          type: string
          format: date-time
          readOnly: true
          title: So'ralgan
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Qaror vaqti
      required:
      - decided_at
      - id
      - requested_at
      - status
      - student
    ModeEnum:
      enum:
      - closed
      - open_now
      - scheduled
      type: string
      description: |-
        * `closed` - Yopiq
        * `open_now` - Hozir ochiq
        * `scheduled` - Jadval bo'yicha
    MoveRequest:
      type: object
      properties:
        target_section:
          type: integer
          minimum: 1
      required:
      - target_section
    MyAssignmentOut:
      type: object
      properties:
        code:
          type: string
        title:
          type: string
        level:
          type: string
        statement:
          type: string
        params: {}
        steps:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentStepOut'
      required:
      - code
      - level
      - params
      - statement
      - steps
      - title
    MyDeadlines:
      type: object
      properties:
        deadlines:
          $ref: '#/components/schemas/IndependentDeadline'
      required:
      - deadlines
    MyMembership:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        section:
          type: string
        instructor:
          type: string
        requested_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
          nullable: true
      required:
      - decided_at
      - id
      - instructor
      - requested_at
      - section
      - status
    MyMembershipEnvelope:
      type: object
      properties:
        membership:
          $ref: '#/components/schemas/MyMembership'
      required:
      - membership
    MyNextWindow:
      type: object
      properties:
        next:
          allOf:
          - $ref: '#/components/schemas/AccessWindowRow'
          title: Open
        server_time:
          type: string
          format: date-time
      required:
      - next
      - server_time
    NullEnum:
      enum:
      - null
    OpenNowRequest:
      type: object
      properties:
        minutes:
          type: integer
          maximum: 10080
          minimum: 1
    PaginatedMemberList:
      type: object
