components:
  schemas:
    AccessWindowList:
      type: object
      properties:
        windows:
          $ref: '#/components/schemas/AccessWindowRow'
        server_time:
          type: string
          format: date-time
      required:
      - server_time
      - windows
    AccessWindowRow:
      type: object
      properties:
        topic:
          type: object
          additionalProperties: {}
        mode:
          type: string
        proctored:
          type: boolean
        state:
          type: object
          additionalProperties: {}
      required:
      - mode
      - proctored
      - state
      - topic
    AiMaxModeEnum:
      enum:
      - 'off'
      - guide
      - explain
      - full
      type: string
      description: |-
        * `off` - O'chiq
        * `guide` - Yo'naltiruvchi
        * `explain` - Tushuntirish
        * `full` - To'liq yordam
    AssignmentStepOut:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        points:
          type: integer
        visible_test:
          type: string
          nullable: true
      required:
      - key
      - points
      - title
      - visible_test
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - new_password
      - old_password
    CourseBrief:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
      required:
      - slug
      - title
    CourseTopics:
      type: object
      properties:
        course:
          $ref: '#/components/schemas/CourseBrief'
        topics:
          type: array
          items:
            $ref: '#/components/schemas/TopicBrief'
      required:
      - course
      - topics
    DatasetOut:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        description:
          type: string
        source_url:
          type: string
          format: uri
        license:
          type: string
        license_url:
          type: string
          format: uri
        rows:
          type: integer
        columns:
          type: array
          items:
            type: string
        size:
          type: integer
      required:
      - columns
      - description
      - license
      - license_url
      - name
      - rows
      - size
      - source_url
      - title
    DeadlineList:
      type: object
      properties:
        deadlines:
          $ref: '#/components/schemas/IndependentDeadline'
      required:
      - deadlines
    DeadlinePutRequest:
      type: object
      properties:
        due_at:
          type: string
          format: date-time
      required:
      - due_at
    DecideRefused:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
      required:
      - code
      - detail
    DecideRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 500
          minItems: 1
        decision:
          $ref: '#/components/schemas/DecisionEnum'
      required:
      - decision
      - ids
    DecideResult:
      type: object
      properties:
        approved:
          type: array
          items:
            type: integer
        rejected:
          type: array
          items:
            type: integer
        skipped:
          type: array
          items:
            type: integer
      required:
      - approved
      - rejected
      - skipped
    DecisionEnum:
      enum:
      - approve
      - reject
      type: string
      description: |-
        * `approve` - approve
        * `reject` - reject
    Direction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nomi
      required:
      - id
      - name
    IndependentDeadline:
      type: object
      properties:
        assignment:
          type: string
        due_at:
          type: string
          format: date-time
      required:
      - assignment
      - due_at
    Instructor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        hemis_id:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
          title: FIO
        student_limit:
          type: integer
          maximum: 10000
          minimum: 1
          title: Talaba limiti
      required:
      - full_name
      - hemis_id
      - id
      - student_limit
    InstructorBrief:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
      required:
      - full_name
      - id
    InstructorBriefRequest:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
          minLength: 1
      required:
      - full_name
      - id
    InstructorCreateRequest:
      type: object
