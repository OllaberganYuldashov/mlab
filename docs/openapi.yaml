openapi: 3.0.3
info:
  title: MLab API
  version: 0.1.0
paths:
  /api/auth/change-password:
    post:
      operationId: auth_change_password_create
      summary: Parolni almashtirish
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      description: 'SPA birinchi chaqiradi: `csrftoken` cookie, keyin u `X-CSRFToken`
        sarlavhasida.'
      summary: CSRF cookie o'rnatish
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/login:
    post:
      operationId: auth_login_create
      summary: Hemis ID va parol bilan kirish (AUTH-02)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginFailed'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginLocked'
          description: ''
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      summary: Chiqish
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me:
    get:
      operationId: auth_me_retrieve
      summary: Joriy foydalanuvchi
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/register:
    post:
      operationId: auth_register_create
      summary: Talaba ro'yxatdan o'tadi (AUTH-01)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
        '400':
          description: No response body
  /api/course/images/{sha256}:
    get:
      operationId: course_images_retrieve
      summary: Ma'ruza rasmi (xesh bo'yicha, abadiy kesh)
      parameters:
      - in: path
        name: sha256
        schema:
          type: string
        required: true
      tags:
      - course
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            image/*:
              schema:
                type: string
                format: binary
          description: ''
  /api/course/quiz/attempts/{attempt_id}:
    get:
      operationId: course_quiz_attempts_retrieve
      summary: Urinish (javoblar faqat topshirilgandan keyin)
      parameters:
      - in: path
        name: attempt_id
        schema:
          type: integer
        required: true
      tags:
      - course
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttemptOut'
          description: ''
  /api/course/quiz/attempts/{attempt_id}/submit:
    post:
      operationId: course_quiz_attempts_submit_create
      summary: Testni topshirish
      parameters:
      - in: path
        name: attempt_id
        schema:
          type: integer
        required: true
      tags:
      - course
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSubmitInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttemptOut'
          description: ''
  /api/course/topics:
    get:
      operationId: course_topics_retrieve
      summary: Kurs mavzulari (talabaga — laboratoriya holati bilan)
      tags:
      - course
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseTopics'
          description: ''
  /api/course/topics/{code}/lecture:
    get:
      operationId: course_topics_lecture_retrieve
      summary: Ma'ruza qadamlari (rasm havolalari xesh URL bilan)
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - course
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LectureOut'
          description: ''
  /api/course/topics/{code}/quiz:
    get:
      operationId: course_topics_quiz_retrieve
      summary: 'Mavzu testi: sozlamalar va mening urinishlarim'
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - course
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSummary'
          description: ''
  /api/course/topics/{code}/quiz/attempts:
    post:
      operationId: course_topics_quiz_attempts_create
      summary: Testni boshlash
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - course
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttemptOut'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttemptOut'
          description: ''
  /api/datasets:
    get:
      operationId: datasets_list
      description: 'DAT-02: datasetlar ro''yxati — manba havolasi va litsenziya bilan.'
      summary: Kurs datasetlari (manba va litsenziya)
      tags:
      - datasets
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetOut'
          description: ''
  /api/datasets/{name}/file:
    get:
      operationId: datasets_file_retrieve
      description: 'LAB-04: `mlab.load("nomi")` shu yerdan CSV oladi (Pyodide worker,
        o''z sessiyasi bilan).'
      summary: Dataset CSV fayli
      parameters:
      - in: path
        name: name
        schema:
          type: string
        required: true
      tags:
      - datasets
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: ''
  /api/directions:
    get:
      operationId: directions_list
      description: Ro'yxatdan o'tish formasidagi yo'nalishlar (kichik ro'yxat — sahifalashsiz).
      tags:
      - directions
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Direction'
          description: ''
  /api/instructors:
    post:
      operationId: instructors_create
      description: Admin yoki super admin o'qituvchi yaratadi; vaqtinchalik parol
        javobda bir marta.
      summary: O'qituvchi akkauntini yaratish
      tags:
      - instructors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstructorCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructorCreated'
          description: ''
  /api/instructors/{user_id}:
    patch:
      operationId: instructors_partial_update
      summary: O'qituvchining talaba limitini o'zgartirish
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - instructors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInstructorRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructor'
          description: ''
  /api/join/{token}:
    get:
      operationId: join_retrieve
      summary: Havola bo'yicha guruhni ko'rish
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - join
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinPreview'
          description: ''
    post:
      operationId: join_create
      summary: A'zolik so'rovini yuborish
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - join
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyMembership'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyMembership'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRefused'
          description: ''
  /api/labs/{code}/assignment:
    get:
      operationId: labs_assignment_retrieve
      summary: Mening topshirig'im (shart va testlar)
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - labs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAssignmentOut'
          description: ''
  /api/labs/{code}/events:
    post:
      operationId: labs_events_create
      description: 'INT-01: paste qaydi. Rad etish chegarasi serverda qayta hisoblanadi.'
      summary: Laboratoriya hodisasi
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_EventInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabEventOut'
          description: ''
  /api/labs/{code}/submissions:
    get:
      operationId: labs_submissions_retrieve
      summary: Mening urinishlarim (oxirgi 20)
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - labs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionListOut'
          description: ''
    post:
      operationId: labs_submissions_create
      summary: 'Topshirish: kod navbatga qo''yiladi (yashirin testlar sandbox''da)'
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_SubmitInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionOut'
          description: ''
  /api/labs/{code}/work:
    get:
      operationId: labs_work_retrieve
      summary: Mening laboratoriya ishim
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - labs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabWorkOut'
          description: ''
    put:
      operationId: labs_work_update
      summary: Avtosaqlash (optimistik versiya bilan)
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabSaveInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabSaveOut'
          description: ''
  /api/me/deadlines:
    get:
      operationId: me_deadlines_retrieve
      description: 'Talaba: faqat tasdiqlangan guruhining muddatlari.'
      summary: Mening mustaqil topshiriq muddatlarim
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyDeadlines'
          description: ''
  /api/me/membership:
    get:
      operationId: me_membership_retrieve
      summary: Talabaning oxirgi a'zoligi va holati
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyMembershipEnvelope'
          description: ''
  /api/me/next-window:
    get:
      operationId: me_next_window_retrieve
      description: |-
        ACC-05: talaba ochiq laboratoriyalarni va keyingi ochiladigan mavzuni ko'radi.

        `server_time` bilan: mijoz soat farqini hisoblab, qolgan vaqtni o'zi sanaydi va ochilish
        lahzasida shu endpoint'ni qayta so'raydi (rejalashtirilgan ochilish push'i — I3, Celery beat).
      summary: Mening ochiq va keyingi laboratoriyalarim
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyNextWindow'
          description: ''
  /api/policy:
    get:
      operationId: policy_retrieve
      description: Ro'yxatdan o'tish formasi yuboradigan siyosat versiyasi — `Consent`
        bilan bir manba.
      summary: Joriy siyosat versiyasi
      tags:
      - policy
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyVersion'
          description: ''
  /api/sections:
    get:
      operationId: sections_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSectionList'
          description: ''
    post:
      operationId: sections_create
      tags:
      - sections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Section'
          description: ''
  /api/sections/{section_id}:
    get:
      operationId: sections_retrieve
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionUpdate'
          description: ''
    patch:
      operationId: sections_partial_update
      summary: Guruhni o'zgartirish (nomi, sig'im, qo'shilish)
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSectionUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionUpdate'
          description: ''
  /api/sections/{section_id}/ai/disable:
    post:
      operationId: sections_ai_disable_create
      description: 'SET-02: AI tutorni bir tugma bilan darhol o''chirish yoki yoqish
        (tasdiq so''ralmaydi).'
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionSettings'
          description: ''
  /api/sections/{section_id}/ai/enable:
    post:
      operationId: sections_ai_enable_create
      description: 'SET-02: AI tutorni bir tugma bilan darhol o''chirish yoki yoqish
        (tasdiq so''ralmaydi).'
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionSettings'
          description: ''
  /api/sections/{section_id}/deadlines:
    get:
      operationId: sections_deadlines_retrieve
      summary: Guruhning mustaqil topshiriq muddatlari
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadlineList'
          description: ''
  /api/sections/{section_id}/deadlines/{code}:
    put:
      operationId: sections_deadlines_update
      summary: Muddat
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeadlinePutRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndependentDeadline'
          description: ''
    delete:
      operationId: sections_deadlines_destroy
      summary: Muddatni olib tashlash
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/sections/{section_id}/join-token:
    post:
      operationId: sections_join_token_create
      description: 'SEC-02: havolani yangilash (eskisi darhol bekor) yoki o''chirish.'
      summary: Havolani yangilash
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinToken'
          description: ''
    delete:
      operationId: sections_join_token_destroy
      description: 'SEC-02: havolani yangilash (eskisi darhol bekor) yoki o''chirish.'
      summary: Havolani o'chirib qo'yish
      parameters:
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/sections/{section_id}/labs/{code}/students/{student_id}/level:
    put:
      operationId: sections_labs_students_level_update
      description: |-
        ADP-02: o'qituvchi o'z guruhidagi talabaning topshiriq darajasini o'zgartiradi (audit bilan).

        Yangi daraja — yangi variant. Ochiq urinish bo'lsa 409 `submission_pending`.
      summary: Talaba darajasini o'zgartirish
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_LevelInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentLevelOut'
          description: ''
  /api/sections/{section_id}/labs/{code}/students/{student_id}/submissions:
    get:
      operationId: sections_labs_students_submissions_retrieve
      description: |-
        O'qituvchi: o'z guruhidagi talabaning urinishlari, kodi va natijasi (AGR-06).

        Begona guruh yoki guruhda tasdiqlanmagan talaba — 404. Yashirin testlar bu yerda ham yashirin.
      summary: Talabaning urinishlari (o'qituvchiga)
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSubmissionsOut'
          description: ''
  /api/sections/{section_id}/labs/{code}/works/{student_id}:
    get:
      operationId: sections_labs_works_retrieve
      summary: Talabaning laboratoriya ishi (o'qituvchiga)
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - sections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabWorkOut'
          description: ''
  /api/sections/{section_id}/members:
    get:
      operationId: sections_members_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: section_id
        schema:
          type: integer
        required: true
      - in: query
        name: status
        schema:
